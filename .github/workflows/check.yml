name: PR 검사

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 안 고칠 파일 확인
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          PATTERN='^src/main/resources/static/(study\.html|css/style\.css|js/(common|api|study-page)\.js)$'
          BLOCKED=$(echo "$CHANGED" | grep -E "$PATTERN" || true)
          if [ -n "$BLOCKED" ]; then
            echo "안 고치기로 한 파일이 바뀜"
            echo "$BLOCKED"
            exit 1
          fi
          echo "통과"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 컴파일 확인
        run: gradle compileJava --no-daemon
